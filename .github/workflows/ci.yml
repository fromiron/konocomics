name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Run unit tests
        run: pnpm test
      - name: Validate catalog
        run: pnpm catalog:validate
      - name: Verify catalog shadow round-trip
        run: pnpm catalog:shadow
      - name: Validate catalog expansion staging and Gold Set
        run: |
          pnpm catalog:expansion:validate
          pnpm catalog:promotion:registry --check
      - name: Verify catalog expansion research derivations
        run: |
          pnpm catalog:expansion:cache-rakuten --check
          pnpm catalog:expansion:adjudicate-rakuten --check
          pnpm catalog:promotion:pilot --check
          pnpm catalog:promotion:batch-002-overlay --check
          pnpm catalog:promotion:apply-batch-002 --check
          pnpm catalog:promotion:batch-003-overlay --check
          pnpm catalog:promotion:apply-batch-003 --check
      - name: Verify generated catalog and context are current
        run: |
          pnpm catalog:build
          pnpm catalog:expansion:promote-library --check
          git diff --exit-code -- \
            data/generated/catalog-v1.json \
            data/generated/recommendation-context-v1.json \
            data/generated/recommendation-profile-catalog-v1.json \
            data/generated/recommendation-profile-context-v1.json \
            src/data/generated/catalog-identity-v1.json \
            src/data/generated/catalog-v1.json \
            src/data/generated/landing-v1.json \
            src/data/generated/recommendation-context-v1.json
      - name: Build
        run: pnpm build
      - name: Build G2 harness
        run: pnpm harness:build
